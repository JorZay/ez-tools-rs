[package]
name = "recmd"
description = "Command line registry hive parser (searches, key dumps, batch mode to CSV/JSON) with RECmd's output"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
ez-common = { version = "0.1.0", path = "../ez-common" }
fancy-regex = "0.20.0"
registry-ez = { version = "0.1.0", path = "../registry-ez" }
registry-plugins = { version = "0.1.0", path = "../registry-plugins" }
sha1 = "0.11.0"
ureq = { version = "3.5.0", optional = true }
yaml-rust2 = "0.13.0"
zip = { version = "7.3.0", default-features = false, features = ["deflate"], optional = true }

[features]
# --sync: download batch files from GitHub (adds an HTTP client)
sync = ["dep:ureq", "dep:zip"]
