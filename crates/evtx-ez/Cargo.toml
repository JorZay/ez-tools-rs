[package]
name = "evtx-ez"
description = "Windows event log (EVTX) parser with EvtxECmd-compatible output, maps, and merged timelines"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
blake3 = { version = "1.8.7", features = ["mmap"] }
crc32fast = "1.5.4"
ez-common = { version = "0.1.0", path = "../ez-common" }
fancy-regex = "0.20.0"
lz4_flex = "0.14.0"
memmap2 = "0.9.12"
rayon = "1.12.0"
tempfile = "3.27.0"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
yaml-rust2 = "0.13.0"

[dev-dependencies]
flate2 = "1.1.10"
tempfile = "3.27.0"
