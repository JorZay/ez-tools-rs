[package]
name = "evtxecmd"
description = "Command line EVTX parser: CSV/JSON timelines from forensic extractions"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
evtx-ez = { path = "../evtx-ez" }
rayon = "1.12.0"
ureq = { version = "3.5.0", optional = true }
zip = { version = "7.3.0", default-features = false, features = ["deflate"], optional = true }

[features]
# --sync: download maps from GitHub (adds an HTTP client)
sync = ["dep:ureq", "dep:zip"]
