[package]
name = "wxtcmd"
description = "Reads the Windows Timeline database (ActivitiesCache.db) to CSV, with WxTCmd's output"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
activitiescache-ez = { version = "0.1.0", path = "../activitiescache-ez" }
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
ez-common = { version = "0.1.0", path = "../ez-common" }

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
