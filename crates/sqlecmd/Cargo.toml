[package]
name = "sqlecmd"
description = "Runs SQLECmd's maps on SQLite databases, to CSV, JSON and blob files, with SQLECmd's output"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
ez-common = { version = "0.1.0", path = "../ez-common" }
sha1 = "0.11.0"
sqlmap-ez = { version = "0.1.0", path = "../sqlmap-ez" }
ureq = { version = "3.5.0", optional = true }
zip = { version = "7.3.0", default-features = false, features = ["deflate"], optional = true }

[features]
sync = ["dep:ureq", "dep:zip"]
